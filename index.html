<!DOCTYPE html>
<html lang="zh-TW"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f08a4b"><title>AI 寵物健康管家</title>
<style>
:root{--bg:#fff8f1;--card:#fff;--pri:#e8743b;--pri2:#ffb36b;--soft:#fdeee2;--txt:#33241b;--mut:#7a6455;--ok:#2f9a5e;--warn:#d98a1c;--bad:#d9443b;--line:#f0e0d2;--gold:#c99a2e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--txt);font-size:16px;line-height:1.5;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
header{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;padding:14px 16px 18px;border-radius:0 0 22px 22px}
.hrow{display:flex;align-items:center;gap:10px;max-width:760px;margin:0 auto}
header h1{margin:0;font-size:18px;flex:1}
.petchips{display:flex;gap:8px;overflow-x:auto;max-width:760px;margin:12px auto 0;scrollbar-width:none}
.petchip{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.25);color:#fff;border:2px solid transparent;border-radius:24px;padding:5px 12px 5px 5px;font-size:15px;white-space:nowrap;cursor:pointer}
.petchip.on{background:#fff;color:var(--txt)}.petchip img,.petchip .em{width:30px;height:30px;border-radius:50%;object-fit:cover;background:#fde3cc;display:flex;align-items:center;justify-content:center;font-size:18px}
.badge{background:rgba(255,255,255,.25);color:#fff;border:0;border-radius:16px;padding:6px 10px;font-size:13px;cursor:pointer;font-weight:bold}
.badge.pro{background:#fff6dc;color:var(--gold)}
main{max-width:760px;margin:0 auto;padding:14px}
.card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 2px 12px rgba(150,90,40,.07)}
.card h2{margin:0 0 10px;font-size:17px}h3{font-size:16px;margin:14px 0 8px}
.mut{color:var(--mut);font-size:14px}
label.f{display:block;font-size:14px;color:var(--mut);margin:10px 0 4px}
input,select,textarea{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:12px;font-size:16px;font-family:inherit;background:#fffdfb;color:var(--txt)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pri)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--pri);color:#fff;border:0;min-height:48px;padding:12px 18px;border-radius:14px;cursor:pointer;font-size:16px;font-weight:600;font-family:inherit}
.btn.block{width:100%}.btn.sec{background:var(--soft);color:var(--txt)}.btn.ghost{background:none;color:var(--pri);min-height:40px;padding:8px}
.btn.red{background:#fdeceb;color:var(--bad)}.btn.gold{background:linear-gradient(135deg,#e2b544,#c99a2e)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}.row>.btn{flex:1}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pill{display:inline-block;padding:3px 10px;border-radius:12px;font-size:13px;font-weight:600}
.p-ok{background:#e4f5ea;color:var(--ok)}.p-warn{background:#fff1d9;color:#a8640a}.p-bad{background:#fde3e1;color:var(--bad)}
.avatar{width:64px;height:64px;border-radius:50%;object-fit:cover;background:#fde3cc;display:flex;align-items:center;justify-content:center;font-size:32px;flex-shrink:0}
.pet{display:flex;gap:12px;align-items:center}
.due{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;margin:8px 0;background:#f6fbf7}
.due.warn{background:#fff7e8}.due.bad{background:#fff0ef}.due .ic{font-size:26px}.due .t{flex:1}.due b{display:block}
.check{display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;background:#fffaf5;margin:6px 0;cursor:pointer;font-size:16px}
.check .box{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.check.done .box{background:var(--ok);border-color:var(--ok);color:#fff}.check.done span.l{color:var(--mut);text-decoration:line-through}
.alert{padding:12px;border-radius:12px;margin:8px 0;background:#fff7e8;font-size:15px}.alert.bad{background:#fff0ef}.alert.ok{background:#eef8f2}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:#fff;border-radius:14px;padding:10px 12px;min-height:48px;font-size:15px;cursor:pointer;font-family:inherit;color:var(--txt);display:flex;align-items:center;gap:6px}
.chip.on{border-color:var(--pri);background:var(--soft);font-weight:600}.chip.emg.on{border-color:var(--bad);background:#fff0ef}
.chip .e{font-size:22px}
input[type=range]{padding:0;border:0;accent-color:var(--pri);height:36px}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left}
.list .it{display:flex;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.list .it:last-child{border:0}
.list .it .ic{font-size:24px;width:40px;height:40px;border-radius:12px;background:var(--soft);display:flex;align-items:center;justify-content:center}
.list .it .t{flex:1}.list .it small{color:var(--mut)}
.seg{display:flex;background:var(--soft);border-radius:14px;padding:4px;gap:4px;overflow-x:auto}
.seg button{flex:1;border:0;background:none;padding:10px 8px;border-radius:10px;font-size:14px;font-family:inherit;color:var(--txt);white-space:nowrap;cursor:pointer}
.seg button.on{background:#fff;font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.disc{background:#fff0ef;border:2px solid var(--bad);color:#9e2a23;padding:12px;border-radius:14px;font-weight:700;text-align:center;font-size:15px}
.res{border-radius:18px;padding:22px 16px;color:#fff;text-align:center}.res .big{font-size:30px;font-weight:800}.res .e{font-size:48px}
.r3{background:linear-gradient(135deg,#e0524a,#b7322b)}.r2{background:linear-gradient(135deg,#f0a43a,#d9801c)}.r0{background:linear-gradient(135deg,#46b072,#2f8f58)}
.steps{display:flex;gap:6px;margin-bottom:12px}.steps i{flex:1;height:6px;border-radius:3px;background:var(--line)}.steps i.on{background:var(--pri)}
.tabbar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:20;box-shadow:0 -4px 16px rgba(150,90,40,.06)}
.tabbar button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--mut);padding:6px 0;cursor:pointer;font-family:inherit;min-height:52px}
.tabbar button .i{font-size:22px;filter:grayscale(1);opacity:.6}.tabbar button.on{color:var(--pri);font-weight:700}.tabbar button.on .i{filter:none;opacity:1}
.fab{position:fixed;right:18px;bottom:calc(84px + env(safe-area-inset-bottom));width:62px;height:62px;border-radius:50%;background:var(--pri);color:#fff;font-size:34px;border:0;box-shadow:0 6px 18px rgba(232,116,59,.45);cursor:pointer;z-index:21;line-height:1}
.sheetbg{position:fixed;inset:0;background:rgba(40,25,15,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet.center{border-radius:20px;margin:auto 16px}
.sheet h2{margin:0 0 6px}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:#33241b;color:#fff;padding:12px 20px;border-radius:24px;z-index:60;font-size:15px;box-shadow:0 6px 18px rgba(0,0,0,.2);transition:opacity .3s}
.onb{text-align:center;padding:26px 18px}.onb .e{font-size:72px}.onb h2{font-size:22px}.dots{display:flex;gap:6px;justify-content:center;margin:14px 0}.dots i{width:8px;height:8px;border-radius:4px;background:var(--line)}.dots i.on{width:22px;background:var(--pri)}
.plan{border:2px solid var(--line);border-radius:18px;padding:16px;margin:10px 0;cursor:pointer;position:relative}.plan.on{border-color:var(--gold);background:#fffaf0}
.plan .tag{position:absolute;top:-11px;right:14px;background:var(--gold);color:#fff;font-size:12px;padding:2px 10px;border-radius:10px}
.cmp td,.cmp th{text-align:center;font-size:14px}.cmp td:first-child,.cmp th:first-child{text-align:left}
.lock{font-size:12px;background:#fff6dc;color:var(--gold);padding:2px 8px;border-radius:10px;font-weight:700}
.soon{font-size:12px;background:#eee;color:#777;padding:2px 8px;border-radius:10px}
.demo{background:#eef3ff;color:#3753a8;border:1.5px dashed #8aa0e0;border-radius:12px;padding:10px;font-size:14px;font-weight:600}
.hidden{display:none!important}#printArea{display:none}
@media (min-width:900px){.fab{right:calc(50% - 360px)}}
@media print{body>*:not(#printArea){display:none!important}body{padding:0}#printArea{display:block;padding:20px}}
</style></head><body>
<header><div class="hrow"><h1>🐾 寵物健康管家</h1><button class="badge" id="planBadge" onclick="go('plan')"></button></div><div class="petchips" id="petChips"></div></header>
<main id="main"></main>
<button class="fab hidden" id="fab" onclick="quickLog()" aria-label="記錄今天">＋</button>
<nav class="tabbar" id="tabbar"></nav>
<div id="printArea"></div>
<script>
// 同網域共用規則：localStorage 只用 pet_ 前綴，禁止 localStorage.clear()；快取/SW 只能用 petsite- 前綴
const KEY='pet_app_v1',PKEY='pet_plan_v1';
if(localStorage.getItem('petapp_v1')!==null){if(localStorage.getItem(KEY)===null)localStorage.setItem(KEY,localStorage.getItem('petapp_v1'));localStorage.removeItem('petapp_v1')}
function clearPetData(){Object.keys(localStorage).filter(k=>k.startsWith('pet_')).forEach(k=>localStorage.removeItem(k))}
let S=JSON.parse(localStorage.getItem(KEY)||'null')||{pets:[],records:[],daily:[],cur:null};
S.pets=S.pets||[];S.records=S.records||[];S.daily=S.daily||[];
let PL=JSON.parse(localStorage.getItem(PKEY)||'null')||{tier:'free',until:null,trial:false,trialUsed:false,ai:{}};
const save=()=>localStorage.setItem(KEY,JSON.stringify(S)),savePL=()=>localStorage.setItem(PKEY,JSON.stringify(PL));
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9);
const ymd=x=>`${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`;
const today=()=>ymd(new Date());
const addDays=(d,n)=>{const x=new Date(d+'T00:00');x.setDate(x.getDate()+n);return ymd(x)};
const diffDays=d=>Math.round((new Date(d+'T00:00')-new Date(today()+'T00:00'))/864e5);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cur=()=>S.pets.find(p=>p.id===S.cur);
const TYPES={vaccine:['💉','疫苗'],deworm:['🪱','驅蟲'],med:['💊','用藥'],vet:['🏥','看診']};
const FOOD=[['😋','正常'],['🥄','吃得少'],['🚫','沒吃'],['🍖','吃得多']],STOOL=[['👍','正常'],['💧','軟便'],['🌊','腹瀉'],['🪨','便秘'],['🩸','血便']],MOOD=[['🤩','活潑'],['🙂','普通'],['😴','懶散'],['😰','焦躁']];
// ---------- 方案 ----------
const isPro=()=>PL.tier==='pro'&&(!PL.until||PL.until>=today());
const FREE_AI=3,month=()=>today().slice(0,7);
const aiLeft=()=>isPro()?Infinity:Math.max(0,FREE_AI-(PL.ai[month()]||0));
// ---------- UI helpers ----------
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.style.opacity=0,1800);setTimeout(()=>t.remove(),2200)}
function sheet(html,center){closeSheet();const b=document.createElement('div');b.className='sheetbg';b.id='sheet';b.innerHTML=`<div class="sheet ${center?'center':''}">${html}</div>`;b.onclick=e=>{if(e.target===b)closeSheet()};document.body.appendChild(b);return b}
function closeSheet(){const s=$('#sheet');if(s)s.remove()}
function confirmBox(msg,ok,label='刪除'){sheet(`<h2>確定嗎？</h2><p>${msg}</p><div class="row"><button class="btn sec" onclick="closeSheet()">取消</button><button class="btn" style="background:var(--bad)" id="cfOk">${label}</button></div>`,true);$('#cfOk').onclick=()=>{closeSheet();ok()}}
function age(b){if(!b)return'';const m=(new Date()-new Date(b+'T00:00'))/2.63e9;return m<12?Math.floor(m)+' 個月':(m/12).toFixed(1).replace('.0','')+' 歲'}
function avatar(p,cls='avatar'){return p.photo?`<img class="${cls}" src="${p.photo}" alt="">`:`<div class="${cls}">${p.species==='cat'?'🐱':'🐶'}</div>`}
const TABS=[['dash','🏠','首頁'],['daily','📝','紀錄'],['passport','📘','護照'],['ai','🩺','症狀'],['me','👤','我的']];
let tab='dash',onbStep=0,aiState=null,pfilter='all';
function go(t){tab=t;aiState=t==='ai'?aiState:null;render();window.scrollTo(0,0)}
function render(){if(!cur()&&S.pets.length)S.cur=S.pets[0].id;
 $('#tabbar').innerHTML=TABS.map(([k,i,l])=>`<button class="${k===tab||(tab==='pets'||tab==='plan'||tab==='share')&&k==='me'?'on':''}" onclick="go('${k}')"><span class="i">${i}</span>${l}</button>`).join('');
 $('#planBadge').className='badge'+(isPro()?' pro':'');$('#planBadge').textContent=isPro()?(PL.trial?'👑 試用中':'👑 Premium'):'免費版 · 升級';
 $('#petChips').innerHTML=S.pets.map(p=>`<div class="petchip ${p.id===S.cur?'on':''}" onclick="S.cur='${p.id}';save();render()">${p.photo?`<img src="${p.photo}">`:`<span class="em">${p.species==='cat'?'🐱':'🐶'}</span>`}${esc(p.name)}</div>`).join('')+(S.pets.length?`<div class="petchip" onclick="addPet()"><span class="em">＋</span>新增</div>`:'');
 $('#fab').classList.toggle('hidden',!S.pets.length||!['dash','daily'].includes(tab));
 $('#tabbar').classList.toggle('hidden',!S.pets.length&&tab==='dash');
 $('#main').innerHTML=(!S.pets.length&&!['me','plan','share','pets'].includes(tab))?onboarding():V[tab]();(A[tab]||(()=>{}))()}
// ---------- onboarding ----------
const ONB=[['🐾','歡迎來到寵物健康管家','把毛孩的疫苗、看診、每天吃喝拉撒，通通記在一個地方。'],['🔔','到期自動提醒','疫苗、驅蟲快到期會提醒你，再也不怕忘記。'],['🩺','覺得怪怪的？先問問看','勾選症狀就能知道要不要馬上看醫生（僅供參考，非獸醫診斷）。']];
function onboarding(){const [e,t,d]=ONB[onbStep];const last=onbStep===ONB.length-1;
 return `<div class="card onb"><div class="e">${e}</div><h2>${t}</h2><p class="mut" style="font-size:16px">${d}</p><div class="dots">${ONB.map((_,i)=>`<i class="${i===onbStep?'on':''}"></i>`).join('')}</div>
 ${last?`<button class="btn block" onclick="addPet()">🐶 新增我的第一隻毛孩</button><div style="height:10px"></div><button class="btn sec block" onclick="seed()">先看看示範資料</button>`:`<button class="btn block" onclick="onbStep++;render()">下一步</button><button class="btn ghost" onclick="onbStep=${ONB.length-1};render()">略過</button>`}</div>`}
// ---------- reminders / trends ----------
function reminders(p){const by={};S.records.filter(r=>r.pet===p.id&&['vaccine','deworm'].includes(r.type)&&r.next).forEach(r=>{if(!by[r.name]||by[r.name].date<r.date)by[r.name]=r});
 return Object.values(by).map(r=>({...r,days:diffDays(r.next)})).sort((a,b)=>a.days-b.days)}
function dueCard(r){const c=r.days<0?'bad':r.days<=14?'warn':'';const pc=r.days<0?'p-bad':r.days<=14?'p-warn':'p-ok';
 return `<div class="due ${c}"><span class="ic">${TYPES[r.type][0]}</span><div class="t"><b>${esc(r.name)}</b><span class="mut">${r.next}</span></div><span class="pill ${pc}">${r.days<0?'逾期 '+(-r.days)+' 天':r.days===0?'就是今天':'還有 '+r.days+' 天'}</span>${r.days<=14?`<button class="btn sec" style="min-height:40px;padding:6px 10px;font-size:14px" onclick="markDone('${r.id}')">完成</button>`:''}</div>`}
function trend(p){const d=S.daily.filter(x=>x.pet===p.id),t=today();const pick=(a,b)=>d.filter(x=>x.date>addDays(t,-a)&&x.date<=addDays(t,-b)).map(x=>+x.activity||0);
 const av=a=>a.length?a.reduce((s,v)=>s+v,0)/a.length:null,a1=av(pick(7,0)),a0=av(pick(14,7)),al=[];
 if(a1!=null&&a0){const ch=(a1-a0)/a0*100;if(ch<=-30)al.push(['bad',`🏃 這週平均活動 ${a1.toFixed(0)} 分鐘，比上週少了 ${Math.abs(ch).toFixed(0)}%。留意牠的精神和食慾喔。`]);else al.push(['ok',`🏃 活動量穩定（這週 ${a1.toFixed(0)} 分 / 上週 ${a0.toFixed(0)} 分）`])}
 const ws=d.filter(x=>x.weight).sort((a,b)=>a.date<b.date?-1:1);if(ws.length>=2){const f=ws[0].weight,l=ws[ws.length-1].weight,c=(l-f)/f*100;if(Math.abs(c)>=5)al.push(['',`⚖️ 體重變化 ${c.toFixed(1)}%（${f} → ${l} kg）`])}
 const bad=d.filter(x=>x.date>addDays(t,-3)&&['軟便','腹瀉','血便'].includes(x.stool));if(bad.length>=2)al.push(['bad',`💩 近 3 天有 ${bad.length} 天便便不太正常，持續的話建議看醫生。`]);
 return al}
// ---------- views ----------
const V={
dash(){const p=cur(),rm=reminders(p),t=today(),log=S.daily.find(x=>x.pet===p.id&&x.date===t);
 const tasks=[['log','📝 記錄今天的吃喝拉撒',!!log],['weigh','⚖️ 量體重',!!(log&&log.weight)]];rm.filter(r=>r.days<=0).forEach(r=>tasks.push(['due:'+r.id,`${TYPES[r.type][0]} ${r.name}（${r.days<0?'已逾期':'今天到期'}）`,false]));
 const done=tasks.filter(x=>x[2]).length,h=new Date().getHours();
 return `<div class="card pet">${avatar(p)}<div style="flex:1"><div class="mut">${h<11?'早安':h<18?'午安':'晚安'}！今天的</div><h2 style="margin:0;font-size:22px">${esc(p.name)}</h2><div class="mut">${p.species==='cat'?'貓咪':'狗狗'}・${esc(p.breed)||'—'}・${age(p.birthday)}・${p.weight||'-'} kg</div>${p.allergies?`<div style="color:var(--bad);font-size:14px">⚠️ 過敏：${esc(p.allergies)}</div>`:''}</div></div>
 <div class="card"><h2>✅ 今日待辦 <span class="mut">${done}/${tasks.length}</span></h2>${tasks.map(([k,l,d])=>`<div class="check ${d?'done':''}" onclick="${k.startsWith('due:')?`markDone('${k.slice(4)}')`:'quickLog()'}"><span class="box">${d?'✓':''}</span><span class="l">${esc(l)}</span></div>`).join('')}
 ${done===tasks.length?'<p class="mut" style="text-align:center">🎉 今天都完成了，好棒！</p>':''}</div>
 <div class="card"><h2>🔔 接下來要做</h2>${rm.length?rm.slice(0,4).map(dueCard).join(''):`<p class="mut">還沒有疫苗或驅蟲的下次日期。</p><button class="btn sec block" onclick="go('passport');setTimeout(addRecord,50)">＋ 新增疫苗紀錄</button>`}</div>
 <div class="card"><h2>📈 健康小提醒</h2>${trend(p).map(([c,t])=>`<div class="alert ${c}">${t}</div>`).join('')||'<p class="mut">連續記錄兩週後，這裡會出現活動量、體重的變化提醒。</p>'}</div>
 <div class="card" style="display:flex;gap:12px;align-items:center;cursor:pointer" onclick="weeklyReport()"><span style="font-size:32px">📊</span><div style="flex:1"><b>本週 AI 健康週報</b><div class="mut">整理這週的飲食、活動、體重變化</div></div>${isPro()?'<span class="pill p-ok">查看</span>':'<span class="lock">👑 Premium</span>'}</div>
 <div class="card" style="display:flex;gap:12px;align-items:center;cursor:pointer" onclick="go('ai')"><span style="font-size:32px">🩺</span><div style="flex:1"><b>毛孩怪怪的？</b><div class="mut">3 步驟症狀初篩，看要不要馬上就醫</div></div><span style="font-size:22px;color:var(--mut)">›</span></div>`},
daily(){const p=cur(),ds=S.daily.filter(x=>x.pet===p.id).sort((a,b)=>a.date<b.date?1:-1);

const SYM=[{id:'breath',e:'😮‍💨',t:'呼吸困難／張嘴喘',lv:3},{id:'seizure',e:'⚡',t:'抽搐／癲癇',lv:3},{id:'toxin',e:'☠️',t:'可能誤食毒物（巧克力、葡萄、百合、人藥）',lv:3},{id:'bloodvomit',e:'🩸',t:'吐血／嘔吐物有血',lv:3},

{id:'vomit',e:'🤮',t:'嘔吐',lv:1},{id:'diarrhea',e:'💩',t:'拉肚子',lv:1},{id:'bloodstool',e:'🩸',t:'便便有血',lv:2},{id:'noeat',e:'🍽️',t:'不太吃',lv:1},{id:'lethargy',e:'😴',t:'沒精神、一直睡',lv:1},
{id:'limp',e:'🦵',t:'跛腳',lv:1},{id:'eye',e:'👁️',t:'眼睛紅、有分泌物',lv:1},{id:'itch',e:'🐾',t:'皮膚癢、掉毛',lv:0},{id:'cough',e:'🤧',t:'咳嗽／打噴嚏',lv:1},{id:'fever',e:'🌡️',t:'身體摸起來很燙',lv:2},{id:'drink',e:'💧',t:'喝水變很多',lv:1}];
const LV=[{t:'居家觀察',e:'🏡',d:'目前看起來不緊急。持續記錄吃喝拉撒，24–48 小時沒改善或變嚴重就去看醫生。'},null,{t:'盡快就醫',e:'⏰',d:'建議 24 小時內帶去給獸醫看，這段時間注意有沒有變嚴重。'},{t:'立即就醫',e:'🚨',d:'可能有生命危險！請馬上去最近的動物醫院或 24 小時急診。'}];
function triage(ids,dur,p){const why=[];let lv=0;const s=ids.map(i=>SYM.find(x=>x.id===i)).filter(Boolean);
 s.forEach(x=>{if(x.lv===3){lv=3;why.push(`「${x.t}」是緊急徵兆 → 立即就醫`)}else if(x.lv===2){lv=Math.max(lv,2);why.push(`「${x.t}」→ 盡快就醫`)}});
 const mild=s.filter(x=>x.lv===1).length;
 if(mild>=3){lv=Math.max(lv,2);why.push(`同時有 ${mild} 個一般症狀 → 盡快就醫`)}
 if(mild>=1&&dur>=3){lv=Math.max(lv,2);why.push('症狀已持續 3 天以上 → 盡快就醫')}
 if(p.species==='cat'&&ids.includes('noeat')&&dur>=1){lv=Math.max(lv,2);why.push('貓咪超過一天不吃有脂肪肝風險 → 盡快就醫')}
 const yrs=p.birthday?(new Date()-new Date(p.birthday+'T00:00'))/3.156e10:3;
 if(mild>=1&&(yrs<0.5||yrs>10)&&lv<2){lv=2;why.push('幼齡（<6 個月）或高齡（>10 歲）抵抗力較弱 → 盡快就醫')}
 if(!why.length)why.push(mild?'只有輕微症狀、時間也不長 → 居家觀察':'沒有勾選明顯症狀 → 居家觀察');
 return {lv,why}}

 <div class="row"><button class="btn sec" onclick="closeSheet()">取消</button><button class="btn" id="pSave">儲存</button></div>`);
 $('#pSave').onclick=async()=>{const n=$('#pName').value.trim();if(!n){$('#pName').focus();return toast('請輸入名字')}const f=$('#pPh').files[0];
  const o={id:e?e.id:uid(),name:n,species:document.querySelector('[data-sp].on').dataset.sp,breed:$('#pBreed').value,birthday:$('#pBd').value,weight:+$('#pW').value||'',allergies:$('#pAl').value,photo:f?await toData(f):(e?e.photo:'')};
  if(e)Object.assign(e,o);else S.pets.push(o);S.cur=o.id;save();closeSheet();if(!e)tab='dash';render();toast(e?'✅ 已更新':`🎉 歡迎 ${n}！`)}}
function pickSp(b){document.querySelectorAll('[data-sp]').forEach(x=>x.classList.remove('on'));b.classList.add('on')}
function addRecord(){sheet(`<h2>新增健康紀錄</h2><label class="f">類型</label><div class="chips" id="rT">${Object.entries(TYPES).map(([k,v],i)=>`<button class="chip ${i?'':'on'}" data-v="${k}" onclick="pickIn(this)"><span class="e">${v[0]}</span>${v[1]}</button>`).join('')}</div>
 <label class="f">項目名稱 *</label><input id="rN" placeholder="例如：八合一疫苗、狂犬病疫苗">
 <div class="g2"><div><label class="f">日期</label><input type="date" id="rD" value="${today()}"></div><div><label class="f">下次日期</label><input type="date" id="rNx"></div></div>
 <div class="chips" style="margin-top:6px"><button class="chip" onclick="nx(30)">+1 個月</button><button class="chip" onclick="nx(90)">+3 個月</button><button class="chip" onclick="nx(365)">+1 年</button></div>
 <label class="f">醫院／備註</label><input id="rNote">
 <div class="row"><button class="btn sec" onclick="closeSheet()">取消</button><button class="btn" id="rSave">儲存</button></div>`);
 $('#rSave').onclick=()=>{const n=$('#rN').value.trim();if(!n){$('#rN').focus();return toast('請輸入項目名稱')}
  S.records.push({id:uid(),pet:S.cur,type:document.querySelector('#rT .on').dataset.v,name:n,date:$('#rD').value,next:$('#rNx').value,note:$('#rNote').value});save();closeSheet();render();toast('✅ 已加入健康護照')}}
function pickIn(b){b.parentNode.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));b.classList.add('on')}
function nx(d){$('#rNx').value=addDays($('#rD').value||today(),d)}
function markDone(id){const r=S.records.find(x=>x.id===id);if(!r)return;const gap=r.next&&r.date?Math.max(30,diffDays(r.next)-diffDays(r.date)):365;
 confirmBox(`標記「${esc(r.name)}」今天已完成？下次日期會自動排在 ${addDays(today(),gap)}。`,()=>{S.records.push({...r,id:uid(),date:today(),next:addDays(today(),gap)});save();render();toast('✅ 已完成，下次會再提醒你')},'已完成')}
const em=(L,v)=>(L.find(x=>x[1]===v)||['•'])[0];
function quickLog(date){const p=cur(),d=date||today(),o=S.daily.find(x=>x.pet===p.id&&x.date===d)||{food:'正常',stool:'正常',mood:'活潑',activity:30,weight:p.weight||''};
 const grp=(id,L,v)=>`<div class="chips" id="${id}">${L.map(([e,l])=>`<button class="chip ${l===v?'on':''}" data-v="${l}" onclick="pickIn(this)"><span class="e">${e}</span>${l}</button>`).join('')}</div>`;
 sheet(`<h2>📝 ${esc(p.name)} ${d===today()?'今天':d}過得如何？</h2><input type="date" id="qD" value="${d}" style="margin:6px 0">
 <label class="f">吃飯</label>${grp('qF',FOOD,o.food)}<label class="f">便便</label>${grp('qS',STOOL,o.stool)}<label class="f">精神</label>${grp('qM',MOOD,o.mood)}
 <label class="f">活動／散步：<b id="qAv" style="color:var(--txt)">${o.activity}</b> 分鐘</label><input type="range" id="qA" min="0" max="180" step="5" value="${o.activity}" oninput="$('#qAv').textContent=this.value">
 <label class="f">體重 (kg，選填)</label><input type="number" inputmode="decimal" step="0.1" id="qW" value="${o.weight||''}">
 <div class="row"><button class="btn sec" onclick="closeSheet()">取消</button><button class="btn" id="qSave">儲存</button></div>`);
 $('#qSave').onclick=()=>{const g=id=>document.querySelector(`#${id} .on`).dataset.v;const n={pet:p.id,date:$('#qD').value||today(),food:g('qF'),stool:g('qS'),mood:g('qM'),activity:+$('#qA').value,weight:+$('#qW').value||''};
  S.daily=S.daily.filter(x=>!(x.pet===p.id&&x.date===n.date));S.daily.push(n);if(n.weight&&n.date>=today())p.weight=n.weight;save();closeSheet();render();
  toast(n.stool==='血便'||n.food==='沒吃'?'已儲存。狀況不太好，可以用「症狀」檢查看看':'✅ 已記錄，'+p.name+'今天也辛苦了！')}}
function drawChart(){const el=$('#chart');if(!el)return;const ws=S.daily.filter(x=>x.pet===S.cur&&x.weight).sort((a,b)=>a.date<b.date?-1:1).slice(-30);
 if(ws.length<2){el.innerHTML='<p class="mut">記錄 2 次以上體重，就會出現趨勢圖。</p>';return}
 const W=600,H=220,P=40,v=ws.map(x=>x.weight),mn=Math.min(...v)-0.2,mx=Math.max(...v)+0.2,X=i=>P+i*(W-2*P)/(ws.length-1),Y=w=>H-P-(w-mn)/(mx-mn)*(H-2*P),pts=ws.map((x,i)=>`${X(i)},${Y(x.weight)}`).join(' ');
 el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="體重趨勢"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8743b" stop-opacity=".3"/><stop offset="1" stop-color="#e8743b" stop-opacity="0"/></linearGradient></defs>
 ${[mn,(mn+mx)/2,mx].map(t=>`<line x1="${P}" x2="${W-P}" y1="${Y(t)}" y2="${Y(t)}" stroke="#f0e0d2"/><text x="4" y="${Y(t)+5}" font-size="14" fill="#7a6455">${t.toFixed(1)}</text>`).join('')}
 <polygon points="${X(0)},${H-P} ${pts} ${X(ws.length-1)},${H-P}" fill="url(#g)"/><polyline points="${pts}" fill="none" stroke="#e8743b" stroke-width="3.5" stroke-linejoin="round"/>
 <circle cx="${X(ws.length-1)}" cy="${Y(v[v.length-1])}" r="6" fill="#e8743b"/><text x="${X(ws.length-1)}" y="${Y(v[v.length-1])-12}" font-size="16" font-weight="bold" fill="#33241b" text-anchor="end">${v[v.length-1]} kg</text>
 <text x="${P}" y="${H-12}" font-size="14" fill="#7a6455">${ws[0].date.slice(5)}</text><text x="${W-P}" y="${H-12}" font-size="14" fill="#7a6455" text-anchor="end">${ws[ws.length-1].date.slice(5)}</text></svg>`}
const A={daily:drawChart,ai(){const f=$('#aPh');if(f)f.onchange=async()=>{if(f.files[0]){aiState.desc=$('#aDesc').value;aiState.photo=await toData(f.files[0]);render()}}}};
function toData(f){return new Promise(r=>{const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas'),s=Math.min(1,400/Math.max(img.width,img.height));c.width=img.width*s;c.height=img.height*s;c.getContext('2d').drawImage(img,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.8))};img.onerror=()=>r(fr.result);img.src=fr.result};fr.readAsDataURL(f)})}
function delPet(id){const p=S.pets.find(x=>x.id===id);confirmBox(`刪除「${esc(p.name)}」和牠所有的紀錄？這無法復原。`,()=>{S.pets=S.pets.filter(x=>x.id!==id);S.records=S.records.filter(r=>r.pet!==id);S.daily=S.daily.filter(r=>r.pet!==id);S.cur=null;save();render();toast('已刪除')})}
function delRec(id){const r=S.records.find(x=>x.id===id);confirmBox(`刪除「${esc(r.name)}」這筆紀錄？`,()=>{S.records=S.records.filter(x=>x.id!==id);save();render();toast('已刪除')})}
function printPass(){const p=cur(),rs=S.records.filter(r=>r.pet===p.id).sort((a,b)=>a.date<b.date?-1:1);
 $('#printArea').innerHTML=`<h1>🐾 寵物健康護照</h1><div style="display:flex;gap:16px;align-items:center">${p.photo?`<img src="${p.photo}" style="width:90px;height:90px;border-radius:50%;object-fit:cover">`:''}<div><h2 style="margin:0">${esc(p.name)}</h2><p>${p.species==='cat'?'貓':'狗'}｜品種：${esc(p.breed)}｜生日：${p.birthday||'-'}（${age(p.birthday)}）｜體重：${p.weight||'-'} kg<br>過敏：${esc(p.allergies)||'無'}</p></div></div>
 ${Object.entries(TYPES).map(([k,v])=>{const l=rs.filter(r=>r.type===k);return l.length?`<h3>${v[0]} ${v[1]}</h3><table border="1" cellspacing="0" cellpadding="4" style="width:100%"><tr><th>項目</th><th>日期</th><th>下次</th><th>備註</th></tr>${l.map(r=>`<tr><td>${esc(r.name)}</td><td>${r.date}</td><td>${r.next||'-'}</td><td>${esc(r.note)}</td></tr>`).join('')}</table>`:''}).join('')}
 ${isPro()?`<h3>⚖️ 體重趨勢</h3><div id="pc"></div>`:''}<p style="margin-top:30px;font-size:11px;color:#888">由 AI 寵物健康管家匯出於 ${today()}${isPro()?'':'・升級 Premium 可加入體重圖表'}</p>`;
 if(isPro()){const tmp=document.createElement('div');tmp.id='chart';document.body.appendChild(tmp);drawChart();$('#pc').innerHTML=tmp.innerHTML;tmp.remove()}window.print()}
function exportJSON(){const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`pet-health-${today()}.json`;a.click();toast('✅ 已匯出')}
function seedAsk(){S.pets.length?confirmBox('載入示範資料會取代目前所有毛孩資料。',seed,'載入'):seed()}
function seed(){const d=uid(),c=uid(),t=today();
 S={cur:d,pets:[{id:d,name:'麻糬',species:'dog',breed:'柴犬',birthday:addDays(t,-365*3-40),weight:9.8,allergies:'雞肉',photo:''},{id:c,name:'奶茶',species:'cat',breed:'米克斯',birthday:addDays(t,-365*11),weight:4.6,allergies:'',photo:''}],
 records:[{id:uid(),pet:d,type:'vaccine',name:'八合一疫苗',date:addDays(t,-355),next:addDays(t,10),note:'安心動物醫院'},{id:uid(),pet:d,type:'vaccine',name:'狂犬病疫苗',date:addDays(t,-200),next:addDays(t,165),note:''},
 {id:uid(),pet:d,type:'deworm',name:'體內外驅蟲',date:addDays(t,-33),next:addDays(t,-3),note:'口服錠'},{id:uid(),pet:d,type:'vet',name:'年度健檢',date:addDays(t,-90),next:'',note:'血檢正常'},
 {id:uid(),pet:d,type:'med',name:'止癢藥',date:addDays(t,-60),next:'',note:'7 天療程'},{id:uid(),pet:c,type:'vaccine',name:'三合一疫苗',date:addDays(t,-300),next:addDays(t,65),note:''},{id:uid(),pet:c,type:'deworm',name:'滴劑驅蟲',date:addDays(t,-20),next:addDays(t,10),note:''}],daily:[]};
 for(let i=20;i>=1;i--){const date=addDays(t,-i);S.daily.push({pet:d,date,food:i<3?'吃得少':'正常',stool:i<=2?'軟便':'正常',activity:i<7?25+Math.round(Math.random()*10):55+Math.round(Math.random()*15),mood:i<5?'懶散':'活潑',weight:+(10.2-(20-i)*0.02+Math.random()*0.1).toFixed(1)});
  S.daily.push({pet:c,date,food:'正常',stool:'正常',activity:20+Math.round(Math.random()*8),mood:'普通',weight:+(4.6+Math.random()*0.1).toFixed(1)})}
 save();tab='dash';render();toast('🧪 已載入示範資料')}
render();
</script></body></html>
